name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The gallery is a private cross-repository submodule. Configure
          # PRESENTTEMPLATE_TOKEN with read access to quangminh1212/PresentTemplate.
          token: ${{ secrets.PRESENTTEMPLATE_TOKEN || github.token }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:all
